server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # GPX originals can be large; the API caps at MAX_UPLOAD_MB too.
    client_max_body_size 64m;

    gzip on;
    gzip_types application/json image/svg+xml text/css application/javascript;

    # Everything dynamic lives on the API container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Datasets come from Mongo, peak/DEM/photo files from the API's static mount.
    location /data/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /photos/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /route-thumbs/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
