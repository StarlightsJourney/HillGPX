name: Deploy

# Builds the static site and publishes it to GitHub Pages.
#
# The datasets under public/data are committed to the repo, so this workflow
# never needs to run the Python scripts, hit OneMap, or hold any secret. A
# contributor's PR is built with exactly the data that is in their branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - name: Site address
        id: site
        run: |
          # A repository variable SITE_URL (Settings → Secrets and variables →
          # Actions → Variables) wins, so this copy can point search engines
          # at the main address (e.g. https://hillgpx.com on Cloudflare).
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "url=${{ vars.SITE_URL }}" >> "$GITHUB_OUTPUT"
          elif [ -f public/CNAME ]; then
            echo "url=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_OUTPUT"
          else
            owner="${{ github.repository_owner }}"
            echo "url=https://${owner,,}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run build
        env:
          # GitHub Pages serves a project site under /<repo>/, so asset URLs
          # need that prefix. With a custom domain (public/CNAME present) the
          # site lives at the root, so the prefix is dropped automatically.
          VITE_BASE: ${{ hashFiles('public/CNAME') != '' && '/' || format('/{0}/', github.event.repository.name) }}
          # The public address for link previews, canonical links and the
          # sitemap (scripts/build_seo.mjs). Set by the "Site address" step.
          VITE_SITE_URL: ${{ steps.site.outputs.url }}
          SITE_URL: ${{ steps.site.outputs.url }}
          # Google sign-in button: the OAuth client ID is public by design —
          # it names the app to Google, it is not a credential. Set it as a
          # repository Variable (not Secret) to render the button on the
          # backup site too; its JavaScript origins must include the
          # github.io domain in Google Cloud for the button to work there.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
