<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>hillGPX: hills, mountains and free GPX routes worldwide</title>
    <meta
      name="description"
      content="A free, open map of 900,000+ hills and mountains in 232 countries, Singapore's stairwells and tall blocks, and a community archive of GPX routes up them. Download any route, share your own."
    />
    <!-- Canonical address and link previews. %VITE_SITE_URL% is the public
         address (vite.config.ts; the deploy sets it from public/CNAME). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:site_name" content="hillGPX" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="hillGPX: hills, mountains and free GPX routes" />
    <meta property="og:description" content="Find a hill to train on anywhere in the world, see honest elevation, and download free GPX routes shared by runners." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "hillGPX",
        "url": "%VITE_SITE_URL%/",
        "description": "A free, open-source map of hills, mountains and community GPX routes, with honest elevation.",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>
    <!-- Absolute paths: Vite prefixes them with `base` (e.g. /HillGPX/) at build. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Figtree, the closest free face to Airbnb Cereal. Preconnect so the
         font request does not wait on DNS and TLS before it starts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- The wordmark's face, subset to the letters of "hillGPX" (a few KB). -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&text=hillGPX&display=block" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
